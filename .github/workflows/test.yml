name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Betik sözdizimi
        run: |
          for f in *.command dosyalar/*.sh test/*.sh; do
            bash -n "$f"
          done

      - name: Aktarıcı sözdizimi
        run: python3 -m py_compile dosyalar/roblox-relay.py

      - name: shellcheck
        run: shellcheck -S warning *.command dosyalar/*.sh test/*.sh

      - name: Otomatik seçim testi
        run: bash test/test-calistir.sh
